<!-- Ellipse 21897 of card 16798:8295 in the card's 386 x 481 space: a
     293.052 x 572.554 ellipse placed by its Figma relativeTransform
     (rotated -29.7°, origin 218.359 / -68), gradient alpha 1 / 1 / .75
     along its own x-axis, layer blur 300 (stdDeviation 150).
     SVG matrix(a b c d e f) = Figma [[a c e],[b d f]].
     The alpha is then raised by 1.2: dividing Figma's render of the
     masked card by its render of the bare image gives the mask it really
     applied, and that was a uniform 1.18-1.22x of the plain blur at every
     point (the shape matched); whatever Figma does to a blurred mask,
     this is what the pixels say. -->

</defs>
<g filter="url(#f)"><g transform="matrix(0.868951 0.494899 -0.494899 0.868951 218.359154 -68)"><ellipse cx="146.5258" cy="286.277" rx="146.5258" ry="286.277" fill="url(#g)"/></g></g>
