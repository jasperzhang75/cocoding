<!-- Ellipse 21897 of card 16798:8257 in the card's 386 x 481 space: a
     332.593 x 532.212 ellipse placed by its Figma relativeTransform
     (rotated -13.6°, origin 114.957 / -42.651), gradient alpha .88 / 1 / .73
     along its own x-axis, layer blur 300 (stdDeviation 150).
     SVG matrix(a b c d e f) = Figma [[a c e],[b d f]].
     The alpha is then raised by 1.2: dividing Figma's render of the
     masked card by its render of the bare image gives the mask it really
     applied, and that was a uniform 1.18-1.22x of the plain blur at every
     point (the shape matched); whatever Figma does to a blurred mask,
     this is what the pixels say. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386 481" width="772" height="962">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.88"/><stop offset="0.5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0.73"/></linearGradient>
<filter id="f" x="-300%" y="-300%" width="700%" height="700%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="150"/><feComponentTransfer><feFuncA type="linear" slope="1.2"/></feComponentTransfer></filter>
</defs>
<g filter="url(#f)"><g transform="matrix(0.971969 0.235109 -0.235109 0.971969 114.956704 -42.650837)"><ellipse cx="166.2967" cy="266.1058" rx="166.2967" ry="266.1058" fill="url(#g)"/></g></g>
</svg>
