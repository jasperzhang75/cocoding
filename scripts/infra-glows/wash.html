<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{position:absolute;left:0;top:0;display:block}</style>
<!-- Ellipse 21903 of frame 4 (Figma 16990:8066 > 17576:8596, read
     2026-10-20): the panel's wash, a 900 x 61 ellipse at 381 / 10.5 in
     panel space, fill #5D7ABE 37%, layer blur 150 (stdDeviation 75).
     The region is the ellipse's box padded by 3 sigma (225) each side. -->
<svg id="s" xmlns="http://www.w3.org/2000/svg"><defs><filter id="f" x="-25%" y="-400%" width="150%" height="900%"><feGaussianBlur stdDeviation="75"/></filter></defs><g filter="url(#f)"><ellipse id="p" cx="381" cy="10.5" rx="450" ry="30.5" fill="#5D7ABE" fill-opacity="0.37"/></g></svg>
<script>
const SC = 2; const p = document.getElementById('p'); const b = p.getBBox(); const PAD = 225;
const x = b.x - PAD, y = b.y - PAD, w = b.width + 2 * PAD, h = b.height + 2 * PAD;
const W = Math.ceil(w * SC), H = Math.ceil(h * SC);
const svg = document.getElementById('s');
svg.setAttribute('viewBox', x + ' ' + y + ' ' + (W / SC) + ' ' + (H / SC)); svg.setAttribute('width', W); svg.setAttribute('height', H);
document.title = JSON.stringify({ x: +x.toFixed(2), y: +y.toFixed(2), w: W / SC, h: H / SC, W, H, bbox: { x: +b.x.toFixed(2), y: +b.y.toFixed(2), w: +b.width.toFixed(2), h: +b.height.toFixed(2) } });
</script>
